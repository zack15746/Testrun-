<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Aether Duel VR</title>
<style>:root{--bg:#0b0d1a;--fg:#fff}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}#vr{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:14px 26px;font-size:18px;border:0;border-radius:12px;background:#7c5cff;color:#fff;z-index:5}#note{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:10px;font-size:12px;opacity:.7;z-index:5}</style></head><body>
<button id="vr">Enter VR</button><div id="note">Aether Duel · tap/click or use the trigger</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ABT={burn:'Burn: 2 dmg to foe on summon',heal:'Heal: +3 LP on summon',shield:'Shield: takes 2 less dmg',pierce:'Pierce: extra dmg hits foe LP',draw:'Draw 1 card on summon',rally:'Rally: allies +1 ATK',none:'No ability',spdmg:'Spell: 4 dmg to foe LP',spheal:'Spell: heal 5 LP',spbuff:'Spell: allies +2 ATK'};
const POOL=[['Emberfang Drake',5,4,3,'#ff6b3d','burn'],['Tidecaller Sprite',2,3,1,'#3db8ff','heal'],['Mossback Golem',3,7,3,'#5fc95f','shield'],['Gale Falcon',3,2,2,'#bfe3ff','pierce'],['Void Scribe',2,2,2,'#b06bff','draw'],['Sunblade Knight',4,4,3,'#ffd23d','rally'],['Cinder Imp',2,1,1,'#ff9a3d','burn'],['Frost Wyrm',6,6,5,'#7fe9ff','none'],['Thorn Sentinel',2,5,2,'#7bd36b','shield'],['Storm Colossus',7,7,6,'#8a7bff','pierce'],['Moon Healer',1,4,2,'#e8e8ff','heal'],['Shadow Fox',3,3,2,'#9a6bd6','draw'],['Magma Titan',8,8,7,'#ff4d2e','burn'],['Dawn Paladin',3,5,3,'#ffe98a','rally'],['Reef Guardian',3,6,3,'#2fb5a8','shield'],['Night Raptor',5,3,3,'#6a5acd','pierce'],['Meteor Shard',0,0,2,'#ff8a3d','spdmg'],['Healing Rain',0,0,2,'#4de0ff','spheal'],['War Banner',0,0,3,'#ffd23d','spbuff'],['Obsidian Dragon',9,9,8,'#5a5a88','burn'],['Spirit Wolf',4,3,2,'#a0e0ff','rally'],['Crystal Mage',3,3,3,'#ff7ad9','draw'],['Iron Bulwark',4,8,4,'#b0b0b0','shield'],['Void Emperor',10,10,9,'#9b30ff','pierce']].map((a,i)=>({id:i,n:a[0],a:a[1],h:a[2],c:a[3],col:a[4],ab:a[5]}));
let S;try{S=JSON.parse(localStorage.getItem('aduel'))}catch(e){}S=S||{own:[0,1,2,3,4,5,6,8],last:''};
const save=()=>{try{localStorage.setItem('aduel',JSON.stringify(S))}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
let AC;const snd=(f,d=.12,t='square')=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0b0d1a);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,50);cam.position.set(0,1.6,0);
const rig=new THREE.Group();rig.add(cam);scene.add(rig);
const floor=new THREE.Mesh(new THREE.CircleGeometry(4,48),new THREE.MeshBasicMaterial({color:0x1a1840}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const ui=new THREE.Group();scene.add(ui);let hit=[];
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

function wrap(x,t,px,py,mw,lh){let l='',y=py;for(const w of t.split(' ')){const s=l?l+' '+w:w;if(x.measureText(s).width>mw&&l){x.fillText(l,px,y);y+=lh;l=w}else l=s}x.fillText(l,px,y)}
function mk(w,h,cw,ch,fn,cb,x,y,z,rx){const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');fn(g);const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),transparent:true}));m.position.set(x,y,z);m.rotation.x=rx||0;if(cb){m.userData.cb=cb;hit.push(m)}ui.add(m);return m}
function box(g,w,h,bg){g.fillStyle=bg;g.beginPath();g.roundRect(0,0,w,h,24);g.fill()}
function btn(t,x,y,z,cb,col){mk(.9,.3,360,120,g=>{box(g,360,120,col||'#7c5cff');g.fillStyle='#fff';g.font='bold 40px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(t,180,60)},cb,x,y,z)}
function txt(t,x,y,z,w,h,size){mk(w,h,w*400,h*400,g=>{g.fillStyle='#fff';g.font='bold '+(size||44)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';const L=t.split('\n');L.forEach((s,i)=>g.fillText(s,w*200,h*200+(i-(L.length-1)/2)*(size||44)*1.2))},null,x,y,z)}
function card(c,x,y,z,s,cb,rx,m){const hp=m?m.hp:c.h,at=m?m.atk:c.a;mk(.4*s,.56*s,256,360,g=>{box(g,256,360,'#14132b');g.fillStyle=c.col;g.fillRect(10,10,236,150);g.fillStyle='#14132b';g.beginPath();g.arc(128,85,50,0,7);g.fill();g.fillStyle=c.col;g.beginPath();g.arc(128,85,34,0,7);g.fill();g.fillStyle='#fff';g.font='bold 24px sans-serif';g.textAlign='center';g.fillText(c.n,128,190);g.font='19px sans-serif';wrap(g,ABT[c.ab],128,222,220,24);g.textAlign='center';g.font='bold 30px sans-serif';g.fillStyle='#ff7a7a';if(c.ab.startsWith('sp')){g.fillStyle='#ff7ad9';g.fillText('SPELL',128,340)}else{g.fillText('⚔'+at,60,340);g.fillStyle='#7aff9a';g.fillText('♥'+hp,200,340)}g.fillStyle='#8ab4ff';g.beginPath();g.arc(30,30,22,0,7);g.fill();g.fillStyle='#000';g.fillText(c.c,30,41)},cb,x,y,z,rx)}

function go(f){ui.clear();hit=[];ui.scale.setScalar(.9);f()}
function menu(msg){go(()=>{txt('AETHER DUEL',0,2.7,-2.5,3,.6,90);txt(msg||'Collect cards. Summon monsters. Win to claim a card!',0,2.2,-2.5,4,.4,34);
const ok=S.last!==today();btn('Battle',-1.65,1.5,-2.2,foes);btn('Deck',1.65,1.5,-2.2,deckB);btn(ok?'Daily Card!':'Daily: claimed',-.55,1.5,-2.2,ok?daily:()=>menu('Come back tomorrow for a new daily card.'),ok?'#e0a020':'#444');btn('Collection',.55,1.5,-2.2,coll);txt('Cards owned: '+S.own.length,0,1,-2.2,3,.3,34)})}
function reveal(c,t){[523,659,784].forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle'),i*120));go(()=>{txt(t,0,2.6,-2.2,4,.5,50);card(c,0,1.6,-2,2.2);btn('Continue',0,.7,-2,()=>menu())})}
function daily(){S.last=today();const c=rnd(POOL);S.own.push(c.id);save();reveal(c,'Daily login card!')}
function coll(){go(()=>{txt('Your Collection',0,2.9,-2.5,3,.5,60);const u=[...new Set(S.own)].sort((a,b)=>a-b);u.forEach((id,i)=>{const n=S.own.filter(v=>v==id).length;card(POOL[id],-1.75+(i%8)*.5,2.2-Math.floor(i/8)*.6,-2.3,.9);if(n>1)txt('x'+n,-1.75+(i%8)*.5,1.9-Math.floor(i/8)*.6,-2.29,.4,.15,28)});btn('Back',0,.45,-2,()=>menu())})}

let B;
const FOES=[{n:'Rookie Duelist',lp:15,bm:0,pool:8,col:'#2fa86b'},{n:'Veteran Warlock',lp:22,bm:0,pool:19,col:'#d49a1a'},{n:'Void Emperor (BOSS)',lp:30,bm:2,pool:24,col:'#9b30ff',boss:1}];
function foes(){go(()=>{txt('Choose your opponent',0,2.7,-2.5,4,.5,56);FOES.forEach((f,i)=>{mk(1.2,.5,480,200,g=>{box(g,480,200,f.col);g.fillStyle='#fff';g.font='bold 34px sans-serif';g.textAlign='center';g.fillText(f.n,240,90);g.font='30px sans-serif';g.fillText('Life '+f.lp+(f.boss?' · rare reward':''),240,145)},()=>startBattle(f),(i-1)*1.4,1.6,-2.3)});btn('Back',0,.9,-2,()=>menu(),'#444')})}
function deckB(){if(!S.deck)S.deck=shuf([...new Set(S.own)]).slice(0,12);go(()=>{const u=[...new Set(S.own)].sort((a,b)=>a-b);txt('Deck Builder: '+S.deck.length+'/12 (min 8)',0,3.1,-2.5,5,.4,50);u.forEach((id,i)=>{const on=S.deck.includes(id),x=-2.05+(i%9)*.52,y=2.5-Math.floor(i/9)*.62;card(POOL[id],x,y,-2.3,.95,()=>{if(on)S.deck=S.deck.filter(v=>v!=id);else if(S.deck.length<12)S.deck.push(id);save();deckB()});if(on)txt('✔',x,y-.33,-2.29,.4,.2,40)});btn('Done',0,.7,-2,()=>{if(S.deck.length<8)deckB();else menu('Deck saved!')},'#2a9d5c')})}
function startBattle(F){const dk=S.deck&&S.deck.length>=8?S.deck:S.own,mine=shuf(dk).slice(0,15).map(i=>POOL[i]),foe=shuf(POOL.filter(c=>c.id<F.pool)).slice(0,12);
B={p:{lp:20,hand:[],deck:mine,f:[],mana:1,max:1},e:{lp:F.lp,hand:[],deck:foe,f:[],mana:F.bm,max:F.bm},msg:'Your turn! Summon cards, then Attack.',over:false,F};
for(let i=0;i<4;i++){dr('p');dr('e')}drawB()}
function dr(s){const o=B[s];if(o.deck.length&&o.hand.length<7)o.hand.push(o.deck.pop())}
function summon(s,c){const o=B[s],f=s=='p'?B.e:B.p,m={...c,hp:c.h,atk:c.a,fresh:true};o.f.push(m);o.mana-=c.c;
snd(600,.2,'triangle');if(c.ab.startsWith('sp')){o.f.pop();if(c.ab=='spdmg')f.lp-=4;if(c.ab=='spheal')o.lp=Math.min(30,o.lp+5);if(c.ab=='spbuff')o.f.forEach(x=>x.atk+=2);return}if(c.ab=='burn')f.lp-=2;if(c.ab=='heal')o.lp=Math.min(30,o.lp+3);if(c.ab=='draw')dr(s);if(c.ab=='rally')o.f.forEach(x=>x.atk++)}
function atk(s){snd(180,.2,'sawtooth');const o=B[s],d=s=='p'?B.e:B.p;for(const a of o.f.slice()){if(a.fresh||a.hp<=0)continue;const t=d.f[0];
if(t){const dm=Math.max(0,a.atk-(t.ab=='shield'?2:0));t.hp-=dm;a.hp-=Math.max(0,t.atk-(a.ab=='shield'?2:0));if(a.ab=='pierce'&&t.hp<0)d.lp+=t.hp;}else d.lp-=a.atk;
d.f=d.f.filter(x=>x.hp>0);o.f=o.f.filter(x=>x.hp>0)}o.f.forEach(x=>x.fresh=false)}
function fin(){if(B.e.lp<=0){B.over=1;const c=B.F.boss?rnd(POOL.slice(19)):rnd(POOL.filter(x=>x.id<B.F.pool));S.own.push(c.id);save();reveal(c,'VICTORY! Reward card:');return 1}if(B.p.lp<=0){B.over=1;go(()=>{txt('DEFEAT...\nTrain up and try again!',0,2.2,-2.2,4,.8,60);btn('Menu',0,1.2,-2,()=>menu())});return 1}}
function play(i){const c=B.p.hand[i];if(!c||c.c>B.p.mana||(B.p.f.length>=3&&!c.ab.startsWith('sp')))return;B.p.hand.splice(i,1);summon('p',c);B.msg='Summoned '+c.n+'!';if(!fin())drawB()}
function endTurn(){atk('p');if(fin())return;const e=B.e;e.max=Math.min(10,e.max+1);e.mana=e.max;dr('e');
e.hand.sort((a,b)=>b.c-a.c);for(const c of e.hand.slice()){if(c.c<=e.mana&&(e.f.length<3||c.ab.startsWith('sp'))){e.hand.splice(e.hand.indexOf(c),1);summon('e',c)}}
atk('e');if(fin())return;const p=B.p;p.max=Math.min(10,p.max+1);p.mana=p.max;dr('p');B.msg='Your turn! Foe has '+e.f.length+' monster(s).';drawB()}
function drawB(){go(()=>{const{p,e}=B;txt(B.F.n+'  ♥ '+e.lp+'    ·    YOU  ♥ '+p.lp+'    ·    Mana '+p.mana+'/'+p.max,0,3.1,-2.5,5,.4,42);txt(B.msg,0,2.8,-2.5,5,.3,30);
e.f.forEach((m,i)=>card(m,(i-1)*.55,2.15,-2.4,1,null,0,m));p.f.forEach((m,i)=>card(m,(i-1)*.55,1.5,-2.0,1,null,0,m));
p.hand.forEach((c,i)=>{const ok=c.c<=p.mana&&(p.f.length<3||c.ab.startsWith('sp'));card(c,(i-(p.hand.length-1)/2)*.5,.75+(ok?.06:0),-1.3,1.1,()=>play(i),-.45)});
btn('Attack & End',1.9,1.5,-1.8,endTurn,'#d6453d');btn('Quit',-1.9,1.5,-1.8,()=>menu(),'#444')})}

const ray=new THREE.Raycaster();
function pick(o,d){ray.set(o,d);const h=ray.intersectObjects(hit)[0];if(h){snd(520,.08);h.object.userData.cb()}}
renderer.domElement.addEventListener('pointerdown',e=>{if(renderer.xr.isPresenting)return;const v=new THREE.Vector3(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1,.5).unproject(cam);pick(cam.position,v.sub(cam.position).normalize())});
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-4)]),new THREE.LineBasicMaterial({color:0x9a8cff}));c.add(l);
c.addEventListener('selectstart',()=>{const m=new THREE.Matrix4().extractRotation(c.matrixWorld);pick(new THREE.Vector3().setFromMatrixPosition(c.matrixWorld),new THREE.Vector3(0,0,-1).applyMatrix4(m))});rig.add(c)}
document.getElementById('vr').onclick=async()=>{try{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']});renderer.xr.setReferenceSpaceType('local-floor');await renderer.xr.setSession(s);document.getElementById('vr').style.display='none';s.addEventListener('end',()=>document.getElementById('vr').style.display='')}catch(e){alert('VR not available here — open this page in the Quest Browser. You can still play with taps/clicks.')}};
menu();renderer.setAnimationLoop(()=>{ui.scale.x+=(1-ui.scale.x)*.2;ui.scale.y=ui.scale.z=ui.scale.x;renderer.render(scene,cam)});
</script></body></html>
