button.m{background:#2c3e50}button.sel{background:#e67e22}button.v{background:#c0392b}button.b{background:#27ae60}
#joy{left:30px;bottom:30px;width:110px;height:110px;border-radius:50%;display:none;background:rgba(0,0,0,.35);pointer-events:none}
#knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.5)}
#ban{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:300;font-size:3rem;font-weight:900;color:#ffcb05;text-shadow:0 0 20px #ff0,3px 3px 0 #e74c3c;pointer-events:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}
#ban.on{transform:translate(-50%,-50%) scale(1)}
</style>

<script type="module">
import * as THREE from 'three';

const $=id=>document.getElementById(id), rnd=a=>a[Math.floor(Math.random()*a.length)];

// ---------- types & moves ----------
const TY={normal:[],fire:['grass','ice','bug'],water:['fire','rock'],grass:['water','rock'],electric:['water'],ice:['grass'],rock:['fire','ice','bug'],bug:['grass'],ghost:['ghost']};
const eff=(a,d)=>TY[a].includes(d)?1.5:TY[d].includes(a)?.67:1;
const SIG={fire:['Ember',55],water:['Water Gun',55],grass:['Vine Whip',55],electric:['Thunder Shock',55],ice:['Frost Shard',55],rock:['Rock Throw',60],bug:['Bug Bite',50],ghost:['Shadow Pulse',55],normal:['Quick Hit',45]};

const movesFor=n=>{const t=SP[n].t,s=SIG[t];return [['Tackle','normal',40,1],[s[0],t,s[1],1],['Power Hit','normal',62,.8]]};

// ---------- monster designs ----------
// body/head: [shape,w,h,d] / [shape,size,y,z]; ext parts: [shape,mat(a/b/g),x,y,z,sx,sy,sz,rx,rz,mirror]
// shapes: s sphere, b box, o octahedron, c cone, y cylinder, d dodecahedron, t torus. g = glowing material
const SP={
Sparkit:{t:'electric',hp:100,c:0xf1c40f,c2:0xd35400,g:0xfff176,body:['s',1,.9,1.1],head:['s',.7,1.1,.3],legs:[4,.3],
 ext:[['c','a',.2,1.6,.25,.18,.5,.18,0,-.3,1],['s','b',.34,1.05,.42,.22,.22,.22,0,0,1],['b','g',0,.8,-.7,.12,.55,.12,.5],['b','g',0,1.15,-.9,.12,.5,.12,-.5],['b','g',0,1.5,-.75,.12,.45,.12,.4]]},
Emberkit:{t:'fire',hp:105,c:0xff6b35,c2:0xffe0b0,g:0xff3c00,body:['s',1.05,.95,1.2],head:['s',.75,1.15,.3],legs:[4,.3],
 ext:[['c','a',0,1.1,.72,.22,.35,.22,1.57],['c','g',.22,1.7,.2,.28,.65,.28,0,-.35,1],['c','a',0,.75,-.8,.45,.9,.45,-1.2],['c','g',0,.95,-1.25,.28,.55,.28,-1.2],['s','b',0,.7,.6,.7,.5,.4]]},
Aquapup:{t:'water',hp:100,c:0x3498db,c2:0x85c1e9,body:['s',1.1,.8,1.4],head:['s',.7,1,.6],legs:[4,.28],
 ext:[['s','a',0,.95,1.0,.32,.26,.38],['s','a',.28,1.3,.45,.22,.22,.22,0,0,1],['c','b',0,1.2,-.1,.12,.55,.5,-.4],['c','b',0,.55,-1.05,.8,.7,.12,-1.57]]},
Sproutling:{t:'grass',hp:90,c:0x58b368,c2:0x2e8b57,g:0xff6fa5,body:['d',1.1,.95,1.1],head:['s',.55,.95,.5],legs:[4,.25],
 ext:[['s','b',0,1.2,-.2,.7,.55,.7],['c','b',.18,1.75,-.2,.2,.75,.2,0,-.5,1],['s','g',0,1.62,-.2,.25,.25,.25]]},
Florapup:{t:'grass',hp:95,c:0x8bc34a,c2:0x33691e,g:0xe91e63,body:['s',1,.9,1.2],head:['s',.7,1.1,.35],legs:[4,.3],
 ext:[['c','b',.3,1.5,.2,.22,.5,.12,0,-.6,1],['t','g',0,1.55,.1,.6,.6,.6,1.57],['s','b',0,1.55,.1,.2,.2,.2],['c','b',0,.75,-.8,.3,.7,.12,-1.2]]},
Frostnip:{t:'ice',hp:90,c:0xaed6f1,c2:0x5dade2,g:0x85e6ff,body:['s',.9,.75,1.7],head:['o',.6,.95,.7],legs:[4,.22],
 ext:[['o','g',0,1.0,.15,.25,.5,.25],['o','g',0,.95,-.25,.22,.6,.22],['o','g',0,.9,-.65,.2,.45,.2],['c','a',.18,1.35,.55,.15,.4,.15,0,-.25,1],['c','b',0,.5,-1.2,.2,1,.2,-1.3]]},
Buzzlet:{t:'bug',hp:70,c:0xf1c40f,c2:0x34495e,g:0xfff59d,body:['s',.8,.75,1.1],head:['s',.55,1,.75],legs:[6,.3,.025],
 ext:[['s','a',0,.85,.35,.65,.6,.65],['s','g',.55,1.15,.1,1,.06,.6,0,.35,1],['y','b',.12,1.55,.7,.04,.45,.04,.4,-.35,1],['b','b',0,.65,-.35,.82,.18,.2],['b','b',0,.55,-.05,.82,.18,.2]]},
Rocko:{t:'rock',hp:110,c:0x7f8c8d,c2:0x5d6d7e,g:0xf39c12,ge:1,body:['b',1,.9,.8],head:['b',.55,1.4,.1],legs:[0],
 ext:[['b','b',.7,.6,0,.3,.75,.3,0,0,1],['d','b',.62,1.15,0,.4,.4,.4,0,0,1],['b','b',.25,.2,0,.3,.4,.3,0,0,1]]},
Terradon:{t:'rock',hp:120,c:0x8d5524,c2:0x6e2c00,g:0xe74c3c,ge:1,sz:1.25,body:['b',1.2,.9,1],head:['b',.65,1.55,.4],legs:[4,.4,.12],
 ext:[['c','b',.22,2.05,.3,.22,.55,.22,0,0,1],['o','b',0,1.15,-.1,.5,.35,.9],['o','b',0,1.1,-.45,.4,.3,.5],['s','b',0,.6,-1.0,.55,.55,.55]]},
Voltara:{t:'electric',hp:105,c:0xf4d03f,c2:0x1c2833,g:0x5dade2,body:['s',.85,.8,1.55],head:['s',.65,1.15,.65],legs:[4,.38],
 ext:[['c','a',.2,1.6,.5,.2,.5,.2,0,-.25,1],['b','b',0,.97,-.3,.5,.1,.12],['b','b',0,1,0,.5,.1,.12],['b','b',0,.97,.3,.5,.1,.12],['o','g',0,.95,.45,.9,.55,.5],['y','a',0,.7,-1.1,.12,1.1,.12,-1.25],['o','g',0,.95,-1.6,.25,.35,.25]]},
Rattail:{t:'normal',hp:85,c:0xa0522d,c2:0xf5cba7,body:['s',.85,.7,1.6],head:['s',.55,.85,.7],legs:[4,.22],
 ext:[['c','a',0,.8,1.05,.2,.5,.2,1.57],['s','a',.25,1.2,.55,.3,.3,.1,0,0,1],['s','b',.25,1.2,.56,.2,.2,.05,0,0,1],['y','b',0,.4,-1.2,.07,1.3,.07,-1.3],['s','k',0,.8,1.3,.1,.1,.1]]},
Wispurr:{t:'ghost',hp:80,c:0x9b59b6,c2:0xd2b4de,g:0xf8e71c,ge:1,fl:.35,body:['s',.9,1.1,.9],head:['s',.7,1.35,.2],legs:[0],
 ext:[['c','b',0,.3,-.2,.3,.7,.3,3.14],['c','b',.25,.3,.2,.25,.6,.25,3.14],['s','a',.6,.9,.2,.28,.28,.28,0,0,1],['c','a',.2,1.75,.1,.16,.4,.16,0,-.3,1]]},
Shellby:{t:'water',hp:100,c:0x48c9b0,c2:0x935116,body:['s',1.1,.55,1.3],head:['s',.55,.75,.85],legs:[4,.15],
 ext:[['d','b',0,1.0,-.1,1,.75,1.1],['c','a',0,1.55,-.1,.18,.4,.18],['c','a',0,1.45,-.45,.15,.35,.15],['s','a',.65,.35,.4,.5,.12,.3,0,0,1],['c','a',0,.5,-.8,.2,.4,.2,-1.3]]}
};
// evolved forms (bigger, with extra unique parts)
const EVO={Sparkit:['Thundrix',10],Emberkit:['Infernox',10],Aquapup:['Torrentus',10],Sproutling:['Thornback',9],Florapup:['Bloomhound',9],Rattail:['Gnashtail',9]},EVN=Object.values(EVO).map(e=>e[0]);
const mkEv=(b,o)=>{SP[o.n]={...SP[b],...o,hp:Math.round(SP[b].hp*1.45),sz:(SP[b].sz||1)*1.3,ext:[...SP[b].ext,...o.ext]}};
mkEv('Sparkit',{n:'Thundrix',c:0xf9a825,c2:0x4a148c,g:0x40c4ff,ext:[['c','g',.3,1.95,.1,.14,.9,.14,0,-.5,1],['c','g',.5,2.25,.05,.1,.6,.1,0,-.9,1],['o','g',0,1.0,.5,1.2,.7,.5],['b','g',0,1.3,-1.2,.14,.6,.14,.5]]});
mkEv('Emberkit',{n:'Infernox',c:0xd84315,c2:0xffcc80,g:0xff6d00,ext:[['c','g',0,2.0,.25,.32,.95,.32],['c','g',.28,1.9,.25,.26,.7,.26,0,-.35,1],['c','g',.35,1.0,-1.1,.3,.8,.3,-1.1,.3,1],['s','g',.7,1.0,.2,.22,.22,.22,0,0,1]]});
mkEv('Aquapup',{n:'Torrentus',c:0x1565c0,c2:0x4dd0e1,g:0x80d8ff,ext:[['c','b',.75,.85,0,.15,.95,.7,0,-1.25,1],['c','b',0,1.9,.35,.15,.85,.5,-.2],['s','g',0,2.05,-.1,.35,.35,.35],['c','b',0,.75,-1.3,.7,.8,.12,-1.4]]});
mkEv('Sproutling',{n:'Thornback',c:0x2e7d32,c2:0x1b5e20,g:0xff5252,ext:[['c','g',.4,1.35,-.3,.18,.75,.18,0,-.5,1],['c','g',0,1.75,-.25,.2,.9,.2],['c','g',.25,1.6,-.7,.16,.65,.16,-.4,-.3,1],['c','w',.14,.9,.9,.1,.4,.1,1.2,-.2,1]]});
mkEv('Florapup',{n:'Bloomhound',c:0x558b2f,c2:0x1b5e20,g:0xff4081,ext:[['t','g',0,1.2,.15,1.7,1.7,1.7,1.57],['t','b',0,1.2,.15,1.35,1.35,1.35,1.57],['c','b',0,.95,-1.2,.4,.9,.14,-1],['s','g',0,1.75,.15,.3,.3,.3]]});
mkEv('Rattail',{n:'Gnashtail',c:0x6d3a1f,c2:0xe0b080,g:0xff5252,ext:[['c','b',0,1.1,-.1,.15,.5,.15,-.3],['c','b',0,1.1,-.55,.15,.55,.15,-.4],['c','w',.1,.72,1.0,.07,.28,.07,3.14,0,1],['s','g',.3,.95,.62,.1,.1,.1,0,0,1]]});
const GE={s:()=>new THREE.SphereGeometry(.5,14,10),b:()=>new THREE.BoxGeometry(1,1,1),o:()=>new THREE.OctahedronGeometry(.6),c:()=>new THREE.ConeGeometry(.5,1,7),y:()=>new THREE.CylinderGeometry(.5,.5,1,8),d:()=>new THREE.DodecahedronGeometry(.55),t:()=>new THREE.TorusGeometry(.4,.14,8,16)};
function build(n){
  const sp=SP[n],g=new THREE.Group(),M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.5,...o}),gc=sp.g||sp.c2;
  const mt={a:M(sp.c,{roughness:sp.t==='ice'?.15:.5}),b:M(sp.c2,{roughness:.7}),g:M(gc,{emissive:gc,emissiveIntensity:.55}),w:M(0xffffff),k:M(0x222222)};
  const P=(k,m,x,y,z,sx,sy,sz,rx=0,rz=0,mir)=>{for(const s of mir?[1,-1]:[1]){const o=new THREE.Mesh(GE[k](),mt[m]);o.position.set(x*s,y,z);o.scale.set(sx,sy,sz);o.rotation.set(rx,0,rz*s);o.castShadow=true;g.add(o)}};
  const [bk,bw,bh,bd]=sp.body;P(bk,'a',0,.6,0,bw,bh,bd);
  const [hk,hs,hy,hz]=sp.head;P(hk,'a',0,hy,hz,hs,hs,hs);
  sp.ext.forEach(e=>P(...e));
  const ex=hs*.28,ey=hy+hs*.08,ez=hz+hs*.46,es=hs*.13;
  if(sp.ge)P('s','g',ex,ey,ez,es*2.4,es*1.6,es,0,0,1);
  else{P('s','w',ex,ey,ez,es*2,es*2,es*2,0,0,1);P('s','k',ex,ey,ez+es*.7,es,es,es,0,0,1)}
  const [nl,lh,lt]=sp.legs;
  for(let i=0;i<nl;i++){const rows=nl/2,z=(rows===3?[.35,0,-.35]:[.3,-.3])[i>>1]*bd,t=(lt||.08)*2;P('y','a',(i%2?1:-1)*bw*.3,lh/2,z,t,lh,t)}
  g.scale.setScalar(sp.sz||1);g.userData={fl:sp.fl||0,s:sp.sz||1};g.position.y=sp.fl||0;return g;
}

// ---------- state ----------
const lvHP=(n,lv)=>Math.round(SP[n].hp*(.8+lv*.04));
const mkMon=(n,mv,lv=5)=>({name:n,sp:SP[n],max:lvHP(n,lv),hp:lvHP(n,lv),lv,xp:0,mv:mv?mv.slice():movesFor(n),mesh:null,starter:!!mv});
const party=[mkMon('Sparkit',STARTER_MOVES)];let ai=0,B=null,cool=0,blanks=5,pick=0,msg='',dirty=1;
const cur=()=>party[ai];
const BIOME=[{n:'Meadow',c:0x5cb85c,s:['Sproutling','Florapup','Rattail','Buzzlet']},{n:'Lakeside',c:0x4fb0c6,s:['Aquapup','Shellby','Frostnip','Rattail']},{n:'Ember Hills',c:0xa0643f,s:['Emberkit','Rocko','Terradon']},{n:'Storm Plains',c:0x8274b3,s:['Sparkit','Voltara','Wispurr']}];
const R=80,biomeAt=(x,z)=>BIOME[(x<0?0:1)+(z<0?0:2)];

// ---------- scene ----------
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ad4f0);scene.fog=new THREE.Fog(0x9ad4f0,15,70);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,120),rig=new THREE.Group();
rig.add(camera);camera.position.set(0,1.6,0);scene.add(rig);
scene.add(new THREE.HemisphereLight(0xffffff,0x88aa66,1.25));
const sun=new THREE.DirectionalLight(0xfff5e0,1.4);sun.position.set(20,30,10);scene.add(sun);
BIOME.forEach((b,i)=>{const p=new THREE.Mesh(new THREE.PlaneGeometry(R,R),new THREE.MeshStandardMaterial({color:b.c,roughness:.95}));p.rotation.x=-Math.PI/2;p.position.set(i%2?R/2:-R/2,0,i>1?R/2:-R/2);scene.add(p)});
const lam=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
function prop(i,x,z){const g=new THREE.Group();
  if(i===0){const t=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,1.8,7),lam(0x6d4c41));t.position.y=.9;const l=new THREE.Mesh(new THREE.SphereGeometry(1.2,9,8),lam(0x388e3c));l.position.y=2.4;g.add(t,l)}
  else if(i===1){const p=new THREE.Mesh(new THREE.CircleGeometry(2+Math.random()*2,20),lam(0x2e86c1,{roughness:.2}));p.rotation.x=-Math.PI/2;p.position.y=.03;g.add(p)}
  else if(i===2){const r=new THREE.Mesh(new THREE.DodecahedronGeometry(.6+Math.random()*.9),lam(0x6b5b55));r.position.y=.5;g.add(r)}
  else{const o=new THREE.Mesh(new THREE.OctahedronGeometry(.6),lam(0xb39ddb,{emissive:0x7e57c2,emissiveIntensity:.5}));o.scale.y=3;o.position.y=1.6;g.add(o)}
  g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<4;i++)for(let k=0;k<26;k++){const x=(Math.random()*(R-4)+2)*(i%2?1:-1),z=(Math.random()*(R-4)+2)*(i>1?1:-1);if(Math.hypot(x,z)>10)prop(i,x,z)}
const pad=new THREE.Mesh(new THREE.TorusGeometry(2.4,.12,8,32),lam(0xffeb3b,{emissive:0xffeb3b,emissiveIntensity:.8}));pad.rotation.x=Math.PI/2;pad.position.y=.1;scene.add(pad);

// trainers
function mkTrainer(col){const g=new THREE.Group(),m=c=>lam(c);
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,.9,10),m(col));b.position.y=1.1;
  const h=new THREE.Mesh(new THREE.SphereGeometry(.22,10,10),m(0xf5cba7));h.position.y=1.75;
  const c=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.1,10),m(0xe74c3c));c.position.y=1.95;
  const l=new THREE.Mesh(new THREE.CylinderGeometry(.09,.09,.7,8),m(0x2c3e50));l.position.set(-.12,.35,0);const l2=l.clone();l2.position.x=.12;
  g.add(b,h,c,l,l2);return g}
const trainers=[
 {name:'Lass Emily',say:"You're going down!",mon:'Florapup',x:-30,z:-26,col:0xe91e63},
 {name:'Picnicker Lily',say:"Let's have a friendly battle!",mon:'Aquapup',x:30,z:-28,col:0x00acc1},
 {name:'Hiker Brad',say:'Feel the power of the mountains!',mon:'Terradon',x:-32,z:30,col:0x8d6e63},
 {name:'Ace Trainer Maya',say:"You won't beat my champion!",mon:'Voltara',x:28,z:32,col:0x5e35b1}];
trainers.forEach(t=>{t.m=mkTrainer(t.col);t.m.position.set(t.x,0,t.z);t.m.rotation.y=Math.PI;scene.add(t.m)});

// wild monsters (visible, wandering)
const wilds=[];
function spawnWild(){let x,z;do{x=(Math.random()*2-1)*(R-5);z=(Math.random()*2-1)*(R-5)}while(Math.hypot(x,z)<14);
  const n=rnd(biomeAt(x,z).s),m=build(n);m.position.set(x,m.userData.fl,z);scene.add(m);wilds.push({m,n,hx:x,hz:z,tx:x,tz:z,t:Math.random()*3})}
for(let i=0;i<30;i++)spawnWild();

// player party mesh
let noSave=0;
try{const d=JSON.parse(localStorage.getItem('aether-save'));if(d&&d.p&&d.p.length){party.length=0;
  d.p.forEach(o=>{if(!SP[o.n])return;const m=mkMon(o.n,o.s?STARTER_MOVES:null,o.l||5);m.xp=o.x||0;if(EVN.includes(o.n))evoMove(m);m.hp=Math.max(0,Math.min(m.max,o.h));party.push(m)});
  if(!party.length)party.push(mkMon('Sparkit',STARTER_MOVES));ai=Math.min(d.a||0,party.length-1);blanks=d.b??5;
  (d.t||[]).forEach(i=>{if(trainers[i])trainers[i].done=1});rig.position.set(d.x||0,0,d.z||0)}}catch(e){}

    setTimeout(sh,650)}}}
function caught(){B.over=true;const e=B.e;e.hp=Math.max(e.hp,Math.ceil(e.max*.4));party.push(e);
  ball.material[4]=ball.material[5]=cardMat(e);sfx('sealed');puff('electric',ball.position.clone(),26,3,2);scene.remove(B.em);wilds.splice(wilds.indexOf(B.wild),1);setTimeout(spawnWild,6000);
  say(e.name+' was sealed into a card! Use Cards to activate it.');banner('Card Sealed!');setTimeout(()=>{ball.visible=false;end(false)},2800)}

// ---------- input ----------
const keys={},joy={x:0,y:0},look={yaw:0,pitch:0},dr={};
addEventListener('keydown',e=>{keys[e.code]=1;const k=e.code;if(B){if(k>='Digit1'&&k<='Digit5')useMove(+k[5]-1);if(k==='KeyB')throwBall();if(k==='KeyT')switchMon()}});
addEventListener('keyup',e=>keys[e.code]=0);
if('ontouchstart' in window)$('joy').style.display='block';
addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;const j=e.pointerType==='touch'&&e.clientX<innerWidth*.45;dr[e.pointerId]={x:e.clientX,y:e.clientY,j}});
addEventListener('pointermove',e=>{const d=dr[e.pointerId];if(!d)return;
  if(d.j){let dx=(e.clientX-85)/50,dy=(e.clientY-(innerHeight-85))/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}joy.x=dx;joy.y=dy;$('knob').style.transform='translate('+dx*30+'px,'+dy*30+'px)'}
  else{look.yaw-=(e.clientX-d.x)*.005;look.pitch=Math.max(-1.2,Math.min(1.2,look.pitch-(e.clientY-d.y)*.005));d.x=e.clientX;d.y=e.clientY}});
const pup=e=>{const d=dr[e.pointerId];if(d&&d.j){joy.x=joy.y=0;$('knob').style.transform=''}delete dr[e.pointerId]};
addEventListener('pointerup',pup);addEventListener('pointercancel',pup);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
let turnCd=0;

// ---------- main loop ----------
const clock=new THREE.Clock();let uz=0,sv=0;
renderer.setAnimationLoop(()=>{
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime,xr=renderer.xr.isPresenting,p=rig.position;
  let fw=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-joy.y,st=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  if(xr){turnCd-=dt;const s=renderer.xr.getSession();if(s)for(const src of s.inputSources){const a=src.gamepad&&src.gamepad.axes;if(!a||a.length<4)continue;
    if(src.handedness==='left'){fw-=a[3];st+=a[2]}
    else if(Math.abs(a[2])>.7&&turnCd<=0){turnCd=.35;const d=a[2]>0?1:-1;if(B)B.sel=(B.sel+d+cur().mv.length)%cur().mv.length,renderBar(),dirty=1;else{rig.rotation.y-=d*Math.PI/6;look.yaw=rig.rotation.y}}}}
  else{rig.rotation.y=look.yaw;camera.rotation.x=look.pitch}
  hud.visible=menu.visible=xr;if(xr){let h=-1;for(const c of ctrls){const r=rayHit(c);if(r>=0)h=r}if(h!==hov){hov=h;dirty=1}}
  camera.getWorldDirection(v1);v1.y=0;v1.normalize();const rx=-v1.z,rz=v1.x;
  if(!B){const l=Math.hypot(fw,st),k=l>1?1/l:1,sp=4.2*dt;
    p.x=Math.max(-R+2,Math.min(R-2,p.x+(v1.x*fw+rx*st)*k*sp));p.z=Math.max(-R+2,Math.min(R-2,p.z+(v1.z*fw+rz*st)*k*sp));
    // ally follows
    const am=cur().mesh,tx=p.x-v1.x*2.2+rx*1.3,tz=p.z-v1.z*2.2+rz*1.3,mv=Math.hypot(tx-am.position.x,tz-am.position.z);
    if(mv>.15)face(am,{x:tx,z:tz});am.position.x+=(tx-am.position.x)*Math.min(1,dt*3);am.position.z+=(tz-am.position.z)*Math.min(1,dt*3);
    am.position.y=am.userData.fl+(mv>.4?Math.abs(Math.sin(t*10))*.12:0);
    // healing pad
    if(Math.hypot(p.x,p.z)<3){let ch=0;party.forEach(m=>{if(m.hp<m.max){m.hp=Math.min(m.max,m.hp+dt*25);ch=1}});if(Math.floor(blanks)<5){blanks=Math.min(5,blanks+dt*.7);ch=1}if(ch)upd()}
    // encounters
    if(performance.now()>cool){
      for(const w of wilds)if(Math.hypot(w.m.position.x-p.x,w.m.position.z-p.z)<3.2&&cur().hp>0){startBattle(w.n,null,w);break}
      if(!B)for(const tr of trainers)if(!tr.done&&Math.hypot(tr.x-p.x,tr.z-p.z)<6&&cur().hp>0){startBattle(tr.mon,tr,null);break}}
    if((uz+=dt)>.5){uz=0;upd()}if((sv+=dt)>5){sv=0;save()}
  }else if(B.busy===false||true){cur().mesh.position.y=cur().mesh.userData.fl+Math.abs(Math.sin(t*3))*.04}
  // wild wandering + idle bob
  for(const w of wilds){const m=w.m;if(B&&B.wild===w){m.position.y=m.userData.fl+Math.sin(t*3)*.04;continue}
    w.t-=dt;if(w.t<=0){w.t=2+Math.random()*4;w.tx=w.hx+(Math.random()*2-1)*7;w.tz=w.hz+(Math.random()*2-1)*7}
    const dx=w.tx-m.position.x,dz=w.tz-m.position.z,d=Math.hypot(dx,dz);
    if(d>.3){m.position.x+=dx/d*dt*.9;m.position.z+=dz/d*dt*.9;m.rotation.y=Math.atan2(dx,dz);m.position.y=m.userData.fl+Math.abs(Math.sin(t*6+w.hx))*.07}
    else m.position.y=m.userData.fl+Math.sin(t*2+w.hx)*.03}
  if(B&&B.trainer)B.em.position.y=B.em.userData.fl+Math.sin(t*3)*.04;
  pad.rotation.z=t;updParts(dt);
  if(fly){fly.t+=dt/.7;const k=Math.min(1,fly.t);ball.position.lerpVectors(fly.from,fly.to,k);ball.position.y+=Math.sin(Math.PI*k)*1.3;ball.rotation.y+=.4;if(k>=1){const f=fly;fly=null;f.cb()}}
  if(dirty&&xr){dirty=0;drawHud()}else if(dirty&&!xr)dirty=0;
  renderer.render(scene,camera)});
upd();renderBar();say('Explore! Walk up to a monster to battle it. Heal on the yellow ring.');
</script>
</body>
