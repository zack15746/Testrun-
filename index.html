<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Beasts VR - Catch 'em!</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      overflow: hidden; 
      background: #111; 
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: white;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 100;
      background: rgba(0,0,0,0.8);
      padding: 14px 18px;
      border-radius: 16px;
      width: 300px;
      pointer-events: none;
      border: 2px solid rgba(255,255,255,0.12);
    }
    #ui h1 { 
      font-size: 1.2rem; 
      margin-bottom: 6px; 
      color: #ffcb05;
      text-shadow: 0 0 10px rgba(255,203,5,0.35);
    }
    .section-title {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #aaa;
      margin: 8px 0 3px;
    }
    #ui p { font-size: 0.95rem; line-height: 1.35; margin-bottom: 2px; }
    .hp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 8px;
    }
    .hp-bar-container {
      flex: 1;
      height: 14px;
      background: #222;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #444;
    }
    .hp-bar { height: 100%; width: 100%; transition: width 0.35s ease; }
    .hp-bar.enemy { background: linear-gradient(90deg, #e74c3c, #ff6b6b); }
    .hp-bar.ally { background: linear-gradient(90deg, #3498db, #5dade2); }
    #status {
      font-weight: 700;
      color: #a0ffa0;
      margin-top: 10px;
      font-size: 0.92rem;
      min-height: 1.3em;
    }
    #trainer-info {
      margin-top: 6px;
      padding: 6px 10px;
      background: rgba(255,203,5,0.15);
      border-radius: 8px;
      font-size: 0.9rem;
      color: #ffcb05;
      display: none;
    }
    #instructions {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 0.88rem;
      z-index: 100;
      text-align: center;
      pointer-events: none;
      max-width: 94%;
    }
    #buttons {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 14px 28px;
      font-size: 1.05rem;
      font-weight: 800;
      border: 3px solid #ffcb05;
      border-radius: 50px;
      cursor: pointer;
      color: white;
    }
    #enter-vr {
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 8px 25px rgba(231, 76, 60, 0.45);
    }
    #fight-trainer {
      background: linear-gradient(135deg, #8e44ad, #9b59b6);
      box-shadow: 0 8px 25px rgba(142, 68, 173, 0.4);
    }
    #find-wild {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      box-shadow: 0 8px 25px rgba(39, 174, 96, 0.4);
    }
    button:hover { transform: scale(1.05); }
    #catch-banner {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      z-index: 300;
      font-size: 3.2rem;
      font-weight: 900;
      color: #ffcb05;
      text-shadow: 0 0 20px rgba(255,203,5,0.8), 3px 3px 0 #e74c3c;
      pointer-events: none;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }
    #catch-banner.show { transform: translate(-50%, -50%) scale(1); }
  </style>
</head>
<body>
  <div id="ui">
    <h1>Aether Beasts</h1>

    <div id="trainer-info"></div>

    <div class="section-title">Enemy</div>
    <p id="enemy-name">Wild Emberkit</p>
    <div class="hp-row">
      <div class="hp-bar-container"><div id="enemy-hp-bar" class="hp-bar enemy"></div></div>
      <span id="enemy-hp-text" style="font-size:0.85rem;min-width:40px">100</span>
    </div>

    <div class="section-title">Your Monster</div>
    <p id="ally-name">Sparkit</p>
    <div class="hp-row">
      <div class="hp-bar-container"><div id="ally-hp-bar" class="hp-bar ally"></div></div>
      <span id="ally-hp-text" style="font-size:0.85rem;min-width:40px">100</span>
    </div>

    <p id="status">Command your monster!</p>
  </div>

  <div id="catch-banner">Gotcha!</div>

  <div id="instructions">
    Trigger = Order Attack &nbsp;•&nbsp; Grip = Throw Ball (wild only)
  </div>

  <div id="buttons">
    <button id="enter-vr">ENTER VR</button>
    <button id="fight-trainer">Fight Trainer</button>
    <button id="find-wild">Find Wild</button>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';

    // ========== TRAINERS ==========
    const trainers = [
      {
        name: "Youngster Joey",
        dialogue: "My monster is top percentage!",
        monster: { name: "Rattail", maxHP: 85, color: 0xa0522d, accent: 0x8b4513, move: "Quick Attack" }
      },
      {
        name: "Lass Emily",
        dialogue: "You're going down!",
        monster: { name: "Florapup", maxHP: 95, color: 0x2ecc71, accent: 0x27ae60, move: "Vine Whip" }
      },
      {
        name: "Bug Catcher Sam",
        dialogue: "Bugs are the best!",
        monster: { name: "Buzzlet", maxHP: 70, color: 0xf1c40f, accent: 0xd4ac0d, move: "Bug Bite" }
      },
      {
        name: "Camper Rick",
        dialogue: "I trained hard for this!",
        monster: { name: "Rocko", maxHP: 110, color: 0x7f8c8d, accent: 0x5d6d7e, move: "Rock Throw" }
      },
      {
        name: "Picnicker Lily",
        dialogue: "Let's have a friendly battle!",
        monster: { name: "Aquapup", maxHP: 90, color: 0x3498db, accent: 0x2980b9, move: "Water Gun" }
      },
      {
        name: "Hiker Brad",
        dialogue: "Feel the power of the mountains!",
        monster: { name: "Terradon", maxHP: 120, color: 0x6e2c00, accent: 0x4a235a, move: "Magnitude" }
      },
      {
        name: "Ace Trainer Maya",
        dialogue: "You won't beat my champion!",
        monster: { name: "Voltara", maxHP: 105, color: 0xf4d03f, accent: 0xf39c12, move: "Thunderbolt" }
      }
    ];

    // ========== STATE ==========
    let isTrainerBattle = false;
    let currentTrainer = null;

    const enemy = {
      name: "Emberkit",
      maxHP: 100,
      currentHP: 100,
      color: 0xff6b35,
      accent: 0xff3c00,
      move: "Ember"
    };

    const ally = {
      name: "Sparkit",
      maxHP: 100,
      currentHP: 100,
      color: 0xf1c40f,
      accent: 0xf39c12
    };

    let scene, camera, renderer;
    let enemyMesh, allyMesh, ballMesh, trainerMesh;
    let isHoldingBall = false;
    let ballVelocity = new THREE.Vector3();
    let gamePhase = "battle";
    let shakeCount = 0;
    let shakeTimer = 0;
    let turnLock = false;

    // ========== INIT ==========
    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);
      scene.fog = new THREE.Fog(0x87ceeb, 12, 45);

      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 1.6, 3);

      const hemi = new THREE.HemisphereLight(0xffffff, 0x88aa66, 1.3);
      scene.add(hemi);
      const dir = new THREE.DirectionalLight(0xfff5e0, 1.4);
      dir.position.set(5, 12, 6);
      dir.castShadow = true;
      scene.add(dir);

      const ground = new THREE.Mesh(
        new THREE.CircleGeometry(22, 64),
        new THREE.MeshStandardMaterial({ color: 0x5cb85c, roughness: 0.9 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      for (let i = 0; i < 14; i++) {
        const tree = createTree();
        const angle = (i / 14) * Math.PI * 2 + 0.4;
        const dist = 9 + Math.random() * 9;
        tree.position.set(Math.cos(angle) * dist, 0, Math.sin(angle) * dist - 4);
        scene.add(tree);
      }

      enemyMesh = createMonster(enemy.color, enemy.accent, false);
      enemyMesh.position.set(0, 0, -5.5);
      scene.add(enemyMesh);

      allyMesh = createMonster(ally.color, ally.accent, true);
      allyMesh.position.set(-1.4, 0, -2.2);
      allyMesh.rotation.y = 0.6;
      scene.add(allyMesh);

      trainerMesh = createTrainer();
      trainerMesh.position.set(1.6, 0, -4.8);
      trainerMesh.visible = false;
      scene.add(trainerMesh);

      ballMesh = createPokeBall();
      ballMesh.visible = false;
      scene.add(ballMesh);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      renderer.shadowMap.enabled = true;
      document.body.appendChild(renderer.domElement);

      const vrButton = VRButton.createButton(renderer);
      vrButton.style.display = 'none';
      document.body.appendChild(vrButton);

      document.getElementById('enter-vr').addEventListener('click', () => {
        const realBtn = document.getElementById('VRButton');
        if (realBtn) realBtn.click();
      });

      document.getElementById('fight-trainer').addEventListener('click', startTrainerBattle);
      document.getElementById('find-wild').addEventListener('click', startWildBattle);

      setupControllers();
      window.addEventListener('resize', onWindowResize);
      renderer.setAnimationLoop(animate);
      updateUI();
    }

    function createTree() {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18, 0.28, 1.6, 8),
        new THREE.MeshStandardMaterial({ color: 0x6d4c41 })
      );
      trunk.position.y = 0.8;
      trunk.castShadow = true;
      g.add(trunk);
      const leaves = new THREE.Mesh(
        new THREE.SphereGeometry(1.1, 10, 10),
        new THREE.MeshStandardMaterial({ color: 0x388e3c })
      );
      leaves.position.y = 2.1;
      leaves.castShadow = true;
      g.add(leaves);
      return g;
    }

    function createMonster(bodyColor, accentColor, isAlly) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 20, 20),
        new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.35 })
      );
      body.position.y = 0.6;
      body.castShadow = true;
      g.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.4, 18, 18),
        new THREE.MeshStandardMaterial({ color: bodyColor })
      );
      head.position.set(0, 1.25, 0.1);
      head.castShadow = true;
      g.add(head);

      const earMat = new THREE.MeshStandardMaterial({ color: accentColor, emissive: accentColor, emissiveIntensity: 0.4 });
      const earL = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.5, 8), earMat);
      earL.position.set(-0.26, 1.65, 0);
      earL.rotation.z = 0.35;
      g.add(earL);
      const earR = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.5, 8), earMat);
      earR.position.set(0.26, 1.65, 0);
      earR.rotation.z = -0.35;
      g.add(earR);

      const eyeWhite = new THREE.MeshStandardMaterial({ color: 0xffffff });
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), eyeWhite);
      eyeL.position.set(-0.15, 1.28, 0.36);
      g.add(eyeL);
      const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.1, 10, 10), eyeWhite);
      eyeR.position.set(0.15, 1.28, 0.36);
      g.add(eyeR);

      const pupilMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
      const pL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), pupilMat);
      pL.position.set(-0.15, 1.28, 0.44);
      g.add(pL);
      const pR = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), pupilMat);
      pR.position.set(0.15, 1.28, 0.44);
      g.add(pR);

      const smile = new THREE.Mesh(
        new THREE.TorusGeometry(0.11, 0.022, 8, 16, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      smile.position.set(0, 1.14, 0.4);
      smile.rotation.x = Math.PI;
      g.add(smile);

      const tail = new THREE.Mesh(
        new THREE.ConeGeometry(0.2, 0.85, 8),
        new THREE.MeshStandardMaterial({ color: bodyColor })
      );
      tail.position.set(0, 0.5, -0.7);
      tail.rotation.x = Math.PI / 2.1;
      g.add(tail);

      if (isAlly) {
        const badge = new THREE.Mesh(
          new THREE.SphereGeometry(0.08, 10, 10),
          new THREE.MeshStandardMaterial({ color: 0x3498db, emissive: 0x2980b9, emissiveIntensity: 0.5 })
        );
        badge.position.set(0, 1.9, 0);
        g.add(badge);
      }
      return g;
    }

    function createTrainer() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.3, 0.9, 12),
        new THREE.MeshStandardMaterial({ color: 0x3498db })
      );
      body.position.y = 1.1;
      body.castShadow = true;
      g.add(body);

      const head = new THREE.Mesh(
        new THREE.SphereGeometry(0.22, 12, 12),
        new THREE.MeshStandardMaterial({ color: 0xf5cba7 })
      );
      head.position.y = 1.75;
      head.castShadow = true;
      g.add(head);

      const cap = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.25, 0.1, 12),
        new THREE.MeshStandardMaterial({ color: 0xe74c3c })
      );
      cap.position.y = 1.95;
      g.add(cap);

      const brim = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.04, 0.25),
        new THREE.MeshStandardMaterial({ color: 0xe74c3c })
      );
      brim.position.set(0, 1.9, 0.15);
      g.add(brim);

      const legMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
      const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.7, 8), legMat);
      legL.position.set(-0.12, 0.35, 0);
      g.add(legL);
      const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.7, 8), legMat);
      legR.position.set(0.12, 0.35, 0);
      g.add(legR);

      return g;
    }

    function createPokeBall() {
      const g = new THREE.Group();
      const bottom = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 20, 20, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.3 })
      );
      g.add(bottom);
      const top = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 20, 20, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.3 })
      );
      g.add(top);
      const band = new THREE.Mesh(
        new THREE.TorusGeometry(0.13, 0.012, 8, 32),
        new THREE.MeshStandardMaterial({ color: 0x222222 })
      );
      band.rotation.x = Math.PI / 2;
      g.add(band);
      const button = new THREE.Mesh(
        new THREE.CircleGeometry(0.035, 16),
        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xeeeeee, emissiveIntensity: 0.3 })
      );
      button.position.z = 0.131;
      g.add(button);
      const buttonInner = new THREE.Mesh(
        new THREE.CircleGeometry(0.018, 12),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      buttonInner.position.z = 0.133;
      g.add(buttonInner);
      return g;
    }

    function setupControllers() {
      const factory = new XRControllerModelFactory();
      for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        controller.addEventListener('selectstart', onTrigger);
        controller.addEventListener('squeezestart', onGripStart);
        controller.addEventListener('squeezeend', onGripEnd);
        scene.add(controller);
        const grip = renderer.xr.getControllerGrip(i);
        grip.add(factory.createControllerModel(grip));
        scene.add(grip);
      }
    }

    // ========== BATTLE MODES ==========
    function startTrainerBattle() {
      currentTrainer = trainers[Math.floor(Math.random() * trainers.length)];
      isTrainerBattle = true;

      enemy.name = currentTrainer.monster.name;
      enemy.maxHP = currentTrainer.monster.maxHP;
      enemy.currentHP = currentTrainer.monster.maxHP;
      enemy.color = currentTrainer.monster.color;
      enemy.accent = currentTrainer.monster.accent;
      enemy.move = currentTrainer.monster.move;

      ally.currentHP = Math.min(ally.maxHP, ally.currentHP + 30);

      updateMonsterColors(enemyMesh, enemy.color, enemy.accent);
      enemyMesh.visible = true;
      enemyMesh.position.set(-0.3, 0, -5.5);
      trainerMesh.visible = true;

      resetBall();
      gamePhase = "battle";
      turnLock = false;

      document.getElementById('trainer-info').style.display = 'block';
      document.getElementById('trainer-info').textContent = currentTrainer.name + ': "' + currentTrainer.dialogue + '"';
      document.getElementById('enemy-name').textContent = currentTrainer.name + "'s " + enemy.name;
      document.getElementById('status').textContent = "Trainer battle! Command your monster!";
      document.getElementById('status').style.color = "#ffcb05";
      document.getElementById('instructions').textContent = "Trigger = Order Attack  •  (No catching in trainer battles)";
      updateUI();
    }

    function startWildBattle() {
      isTrainerBattle = false;
      currentTrainer = null;

      const wilds = [
        { name: "Emberkit", maxHP: 100, color: 0xff6b35, accent: 0xff3c00, move: "Ember" },
        { name: "Aquapup", maxHP: 95, color: 0x3498db, accent: 0x2980b9, move: "Water Gun" },
        { name: "Sproutling", maxHP: 90, color: 0x2ecc71, accent: 0x27ae60, move: "Absorb" },
        { name: "Sparkit", maxHP: 85, color: 0xf1c40f, accent: 0xf39c12, move: "Thunder Shock" },
        { name: "Frostnip", maxHP: 90, color: 0x85c1e9, accent: 0x5dade2, move: "Powder Snow" }
      ];
      const wild = wilds[Math.floor(Math.random() * wilds.length)];

      enemy.name = wild.name;
      enemy.maxHP = wild.maxHP;
      enemy.currentHP = wild.maxHP;
      enemy.color = wild.color;
      enemy.accent = wild.accent;
      enemy.move = wild.move;

      ally.currentHP = Math.min(ally.maxHP, ally.currentHP + 20);

      updateMonsterColors(enemyMesh, enemy.color, enemy.accent);
      enemyMesh.visible = true;
      enemyMesh.position.set(0, 0, -5.5);
      trainerMesh.visible = false;

      resetBall();
      gamePhase = "battle";
      turnLock = false;

      document.getElementById('trainer-info').style.display = 'none';
      document.getElementById('enemy-name').textContent = "Wild " + enemy.name;
      document.getElementById('status').textContent = "A wild monster appeared! Command your monster!";
      document.getElementById('status').style.color = "#a0ffa0";
      document.getElementById('instructions').textContent = "Trigger = Order Attack  •  When weak, Grip = Throw Ball";
      updateUI();
    }

    function updateMonsterColors(mesh, bodyColor, accentColor) {
      if (!mesh) return;
      mesh.children[0].material.color.setHex(bodyColor);
      mesh.children[1].material.color.setHex(bodyColor);
      mesh.children[2].material.color.setHex(accentColor);
      mesh.children[2].material.emissive.setHex(accentColor);
      mesh.children[3].material.color.setHex(accentColor);
      mesh.children[3].material.emissive.setHex(accentColor);
      mesh.children[8].material.color.setHex(bodyColor);
    }

    // ========== INPUT ==========
    function onTrigger() {
      if (turnLock) return;
      if (gamePhase === "battle" || gamePhase === "can_capture") {
        commandAttack();
      }
    }

    function onGripStart(event) {
      if (!isTrainerBattle && gamePhase === "can_capture" && !isHoldingBall && enemy.currentHP > 0) {
        isHoldingBall = true;
        const controller = event.target;
        ballMesh.visible = true;
        controller.attach(ballMesh);
        ballMesh.position.set(0, 0, -0.1);
        document.getElementById('status').textContent = "Throw the Ball!";
        document.getElementById('status').style.color = "#ffcb05";
      }
    }

    function onGripEnd(event) {
      if (isHoldingBall) {
        isHoldingBall = false;
        const controller = event.target;
        scene.attach(ballMesh);

        const direction = new THREE.Vector3();
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);
        direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        ballVelocity.copy(direction).multiplyScalar(7.5);
        ballVelocity.y += 1.8;

        gamePhase = "throwing";
        document.getElementById('status').textContent = "Ball thrown...";
      }
    }

    // ========== COMBAT ==========
    function commandAttack() {
      if (enemy.currentHP <= 0 || ally.currentHP <= 0) return;
      turnLock = true;

      document.getElementById('status').textContent = ally.name + " used Tackle!";
      document.getElementById('status').style.color = "#5dade2";

      const originalZ = allyMesh.position.z;
      allyMesh.position.z -= 0.8;

      setTimeout(() => {
        const dmg = 14 + Math.floor(Math.random() * 11);
        enemy.currentHP = Math.max(0, enemy.currentHP - dmg);
        hitEffect(enemyMesh);
        updateUI();
        allyMesh.position.z = originalZ;

        if (enemy.currentHP <= 0) {
          if (isTrainerBattle) {
            gamePhase = "fainted";
            document.getElementById('status').textContent = "You defeated " + currentTrainer.name + "!";
            document.getElementById('status').style.color = "#2ecc71";
            document.getElementById('trainer-info').textContent = currentTrainer.name + ': "I can\'t believe I lost..."';
          } else {
            gamePhase = "fainted";
            document.getElementById('status').textContent = "Enemy fainted... too late to catch!";
            document.getElementById('status').style.color = "#ff6b6b";
          }
          turnLock = false;
          return;
        }

        if (!isTrainerBattle && enemy.currentHP / enemy.maxHP <= 0.35) {
          gamePhase = "can_capture";
          document.getElementById('status').textContent = "It's weak! Grip to throw Ball!";
          document.getElementById('status').style.color = "#ffcb05";
        }

        setTimeout(() => {
          if (gamePhase === "caught" || gamePhase === "fainted") {
            turnLock = false;
            return;
          }
          enemyAttack();
        }, 700);
      }, 280);
    }

    function enemyAttack() {
      const moveName = enemy.move || "Tackle";
      const prefix = isTrainerBattle ? (currentTrainer.name + "'s ") : "Wild ";
      document.getElementById('status').textContent = prefix + enemy.name + " used " + moveName + "!";
      document.getElementById('status').style.color = "#ff6b6b";

      const originalZ = enemyMesh.position.z;
      enemyMesh.position.z += 0.7;

      setTimeout(() => {
        const dmg = 9 + Math.floor(Math.random() * 10);
        ally.currentHP = Math.max(0, ally.currentHP - dmg);
        hitEffect(allyMesh);
        updateUI();
        enemyMesh.position.z = originalZ;

        if (ally.currentHP <= 0) {
          gamePhase = "ally_fainted";
          document.getElementById('status').textContent = ally.name + " fainted!";
          document.getElementById('status').style.color = "#ff6b6b";
        } else if (gamePhase !== "can_capture") {
          document.getElementById('status').textContent = "Command your monster!";
          document.getElementById('status').style.color = "#a0ffa0";
        }
        turnLock = false;
      }, 280);
    }

    function hitEffect(mesh) {
      mesh.scale.set(1.2, 0.85, 1.2);
      setTimeout(() => mesh.scale.set(1, 1, 1), 120);
      const mat = mesh.children[0].material;
      const orig = mat.color.clone();
      mat.color.set(0xffffff);
      setTimeout(() => mat.color.copy(orig), 90);
    }

    function updateUI() {
      const ePct = (enemy.currentHP / enemy.maxHP) * 100;
      document.getElementById('enemy-hp-bar').style.width = ePct + '%';
      document.getElementById('enemy-hp-text').textContent = Math.ceil(enemy.currentHP);
      if (ePct > 50) document.getElementById('enemy-hp-bar').style.background = 'linear-gradient(90deg, #e74c3c, #ff6b6b)';
      else if (ePct > 25) document.getElementById('enemy-hp-bar').style.background = 'linear-gradient(90deg, #f39c12, #f1c40f)';
      else document.getElementById('enemy-hp-bar').style.background = 'linear-gradient(90deg, #27ae60, #2ecc71)';

      const aPct = (ally.currentHP / ally.maxHP) * 100;
      document.getElementById('ally-hp-bar').style.width = aPct + '%';
      document.getElementById('ally-hp-text').textContent = Math.ceil(ally.currentHP);
    }

    // ========== BALL + CATCH (wild only) ==========
    function animate(time) {
      if (enemyMesh && gamePhase !== "shaking" && gamePhase !== "caught") {
        enemyMesh.position.y = Math.sin(time * 0.003) * 0.06;
        enemyMesh.rotation.y = Math.sin(time * 0.0012) * 0.12;
      }
      if (allyMesh && gamePhase !== "ally_fainted") {
        allyMesh.position.y = Math.sin(time * 0.003 + 1) * 0.05;
      }
      if (trainerMesh && trainerMesh.visible) {
        trainerMesh.rotation.y = Math.sin(time * 0.001) * 0.08;
      }

      if (gamePhase === "throwing" && ballMesh.visible) {
        ballVelocity.y -= 0.18;
        ballMesh.position.add(ballVelocity.clone().multiplyScalar(0.016));
        ballMesh.rotation.x += 0.3;
        ballMesh.rotation.y += 0.2;

        const dist = ballMesh.position.distanceTo(enemyMesh.position.clone().setY(0.7));
        if (dist < 1.2) startCatchSequence();
        if (ballMesh.position.y < 0 || ballMesh.position.z < -15) {
          resetBall();
          document.getElementById('status').textContent = "Missed! Try again!";
          document.getElementById('status').style.color = "#ff9f43";
          gamePhase = "can_capture";
        }
      }

      if (gamePhase === "shaking") {
        shakeTimer += 16;
        if (shakeTimer > 650) {
          shakeTimer = 0;
          shakeCount++;
          ballMesh.rotation.z = (shakeCount % 2 === 0 ? 0.45 : -0.45);
          if (shakeCount >= 3) finishCatch();
        }
      }

      renderer.render(scene, camera);
    }

    function startCatchSequence() {
      gamePhase = "shaking";
      shakeCount = 0;
      shakeTimer = 0;
      ballMesh.position.copy(enemyMesh.position);
      ballMesh.position.y = 0.9;
      enemyMesh.visible = false;
      document.getElementById('status').textContent = "Click...";
      document.getElementById('status').style.color = "#fff";
    }

    function finishCatch() {
      const hpRatio = enemy.currentHP / enemy.maxHP;
      let chance = 0.28 + (0.68 * (1 - hpRatio));
      chance = Math.min(0.93, chance);
      const success = Math.random() < chance;

      if (success) {
        gamePhase = "caught";
        document.getElementById('status').textContent = enemy.name + " was caught!";
        document.getElementById('status').style.color = "#2ecc71";
        document.getElementById('enemy-name').textContent = enemy.name + " joined your party!";

        const banner = document.getElementById('catch-banner');
        banner.textContent = "Gotcha!";
        banner.classList.add('show');
        setTimeout(() => banner.classList.remove('show'), 2500);
        ballMesh.scale.set(1.3, 1.3, 1.3);
      } else {
        document.getElementById('status').textContent = "Oh no! It broke free!";
        document.getElementById('status').style.color = "#e74c3c";
        enemyMesh.visible = true;
        resetBall();
        gamePhase = "can_capture";
        enemy.currentHP = Math.min(enemy.maxHP * 0.4, enemy.currentHP + 7);
        updateUI();
      }
    }

    function resetBall() {
      ballMesh.visible = false;
      ballMesh.position.set(0, 0, 0);
      ballMesh.rotation.set(0, 0, 0);
      ballMesh.scale.set(1, 1, 1);
      ballVelocity.set(0, 0, 0);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>
