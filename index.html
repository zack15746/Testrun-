<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Spirit Wardens: Veil Trials</title>
<style>:root{color-scheme:dark}html,body{margin:0;height:100%;background:#05060d;color:#e8e8f0;font-family:system-ui,sans-serif;overflow:hidden}#ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;pointer-events:none}#ui>*{pointer-events:auto}h1{margin:0;font-size:30px;letter-spacing:2px}p{margin:0;max-width:420px;opacity:.85;line-height:1.4}button{font-size:20px;padding:14px 28px;border:0;border-radius:10px;background:#7fd4ff;color:#05060d;font-weight:700}</style></head><body>
<div id="ui"><h1>SPIRIT WARDENS: VEIL TRIALS</h1><p>Defend the Veil City from Wraiths. Slash with fast sword swings. Trigger = Moon Arc. Grip with full energy = Spirit Burst.</p><button id="go">Enter VR</button><p id="note"></p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x070816);scene.fog=new T.FogExp2(0x070816,0.03);
const cam=new T.PerspectiveCamera(70,innerWidth/innerHeight,.05,200);cam.position.y=1.6;
const rig=new T.Group();rig.add(cam);scene.add(rig);
const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setSize(innerWidth,innerHeight);r.xr.enabled=true;r.xr.setReferenceSpaceType('local-floor');document.body.appendChild(r.domElement);r.domElement.style.cssText='position:fixed;inset:0';
document.body.appendChild(document.getElementById('ui'));
scene.add(new T.HemisphereLight(0x8899ff,0x111122,.9));
const moon=new T.Mesh(new T.SphereGeometry(7,24,16),new T.MeshBasicMaterial({color:0xfff6d8,fog:false}));moon.position.set(-30,40,-70);scene.add(moon);
const ground=new T.Mesh(new T.CircleGeometry(60,48),new T.MeshStandardMaterial({color:0x1a1d33,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
for(let i=0;i<14;i++){const a=i/14*6.283,p=new T.Mesh(new T.BoxGeometry(.9,5+Math.random()*4,.9),new T.MeshStandardMaterial({color:0x2a2f52}));p.position.set(Math.cos(a)*24,2.5,Math.sin(a)*24);scene.add(p)}
{const g=new T.BufferGeometry(),a=[];for(let i=0;i<500;i++){const u=Math.random()*6.283,v=Math.random()*1.4;a.push(Math.cos(u)*Math.cos(v)*90,Math.sin(v)*90+5,Math.sin(u)*Math.cos(v)*90)}g.setAttribute('position',new T.Float32BufferAttribute(a,3));scene.add(new T.Points(g,new T.PointsMaterial({color:0xffffff,size:.5,fog:false})))}
function mkSword(){const g=new T.Group(),m=new T.MeshStandardMaterial({color:0xcfe8ff,emissive:0x5ab8ff,emissiveIntensity:.8}),d=new T.MeshStandardMaterial({color:0x222222});
const b=new T.Mesh(new T.BoxGeometry(.025,.006,.9),m);b.position.z=-.55;const gd=new T.Mesh(new T.BoxGeometry(.1,.015,.03),d);gd.position.z=-.1;const h=new T.Mesh(new T.CylinderGeometry(.015,.015,.14),d);h.rotation.x=Math.PI/2;g.add(b,gd,h);return g}
const hol=[],proj=[],sparks=[];let hp=5,score=0,wave=0,rei=100,state='menu',left=0,bigLeft=0,spawnT=0,msg='',msgT=0,hudT=0;
const ctrls=[0,1].map(i=>{const c=r.xr.getController(i);c.add(mkSword());rig.add(c);c.userData={prev:null};c.addEventListener('selectstart',()=>fire(c));c.addEventListener('squeezestart',()=>burstAll());return c});
function mkHollow(big){const g=new T.Group(),bm=new T.MeshStandardMaterial({color:0x0a0a10,roughness:.9});
const body=new T.Mesh(new T.CylinderGeometry(.25,.5,1.3,10),bm);body.position.y=.65;const head=new T.Mesh(new T.SphereGeometry(.3,12,10),bm);head.position.y=1.5;
const mask=new T.Mesh(new T.SphereGeometry(.26,12,10),new T.MeshStandardMaterial({color:0xf4f4f0,emissive:0x333333}));mask.scale.z=.5;mask.position.set(0,1.5,.22);
const e=new T.MeshBasicMaterial({color:0xff2a2a});[-.1,.1].forEach(x=>{const m=new T.Mesh(new T.SphereGeometry(.035,6,6),e);m.position.set(x,1.55,.34);g.add(m)});
g.add(body,head,mask);if(big)g.scale.setScalar(2);g.userData={hp:big?6:1,big,ph:Math.random()*6,cd:0};return g}
const cen=h=>h.position.clone().add(new T.Vector3(0,.9*h.scale.y,0));
function spawn(){const big=bigLeft>0&&left<=1,h=mkHollow(big),a=Math.random()*6.283;if(big)bigLeft--;h.userData.fast=!big&&wave>=2&&Math.random()<.3;if(h.userData.fast)h.scale.setScalar(.8);h.position.set(Math.cos(a)*18,0,Math.sin(a)*18);h.lookAt(0,0,0);scene.add(h);hol.push(h);left--}
function nextWave(){wave++;left=4+wave*2;bigLeft=wave%3==0?1:0;spawnT=1.5;hp=Math.min(5,hp+(wave>1?1:0));msg='Wave '+wave+'\nTrigger = Moon Arc, Grip = Burst';msgT=3}
function startGame(){hol.forEach(h=>scene.remove(h));hol.length=0;hp=5;score=0;wave=0;rei=100;state='play';nextWave()}
const sg=new T.SphereGeometry(.04,6,6),sm=new T.MeshBasicMaterial({color:0x9fe0ff});
function burst(p){for(let i=0;i<10;i++){const m=new T.Mesh(sg,sm);m.position.copy(p);scene.add(m);sparks.push({m,v:new T.Vector3(Math.random()-.5,Math.random()*1.2,Math.random()-.5).multiplyScalar(4),life:.6})}}
function hit(h,d){const u=h.userData;u.hp-=d;u.cd=.3;const c=cen(h);burst(c);
if(u.hp<=0){score+=u.big?50:10;rei=Math.min(100,rei+10);scene.remove(h);hol.splice(hol.indexOf(h),1)}else h.position.multiplyScalar(1.12)}
function fire(c){if(state==='over'){startGame();return}if(state!=='play'||rei<30)return;rei-=30;
const o=new T.Vector3(),q=new T.Quaternion();c.getWorldPosition(o);c.getWorldQuaternion(q);const dir=new T.Vector3(0,0,-1).applyQuaternion(q);
const m=new T.Mesh(new T.TorusGeometry(.6,.06,8,24,Math.PI),new T.MeshBasicMaterial({color:0x66ccff}));m.quaternion.copy(q).multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(0,0,1),-Math.PI/2));m.position.copy(o).addScaledVector(dir,.6);scene.add(m);
proj.push({m,v:dir.multiplyScalar(14),life:2.5,hit:new Set()})}
function burstAll(){if(state!=='play'||rei<100)return;rei=0;hol.slice().forEach(h=>{if(Math.hypot(h.position.x,h.position.z)<10)hit(h,4)});for(let i=0;i<24;i++){const a=i/24*6.283;burst(new T.Vector3(Math.cos(a)*3,.5,Math.sin(a)*3))}}
const hc=document.createElement('canvas');hc.width=512;hc.height=192;const hx=hc.getContext('2d'),ht=new T.CanvasTexture(hc);
const hud=new T.Mesh(new T.PlaneGeometry(.64,.24),new T.MeshBasicMaterial({map:ht,transparent:true,depthTest:false}));hud.position.set(0,-.38,-1.2);hud.renderOrder=9;cam.add(hud);
function drawHud(){hx.clearRect(0,0,512,192);hx.fillStyle='rgba(5,6,13,.6)';hx.fillRect(0,0,512,192);hx.fillStyle='#fff';hx.font='bold 30px sans-serif';hx.textAlign='center';
hx.fillText('HP '+'\u2665'.repeat(Math.max(hp,0))+'  Wave '+wave+'  Score '+score,256,40);hx.fillStyle='#233';hx.fillRect(56,60,400,18);hx.fillStyle='#5ab8ff';hx.fillRect(56,60,4*rei,18);
hx.fillStyle='#ffd27f';hx.font='24px sans-serif';msg.split('\n').forEach((l,i)=>hx.fillText(l,256,112+i*32));ht.needsUpdate=true}
const clock=new T.Clock(),tp=new T.Vector3(),mp=new T.Vector3();
r.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
if(state==='play'){spawnT-=dt;if(left>0&&spawnT<=0){spawn();spawnT=Math.max(.6,1.6-wave*.05)}
if(left===0&&!hol.length)nextWave();
rei=Math.min(100,rei+8*dt);msgT-=dt;if(msgT<=0&&msg)msg='';
for(let i=hol.length-1;i>=0;i--){const h=hol[i],u=h.userData;u.cd-=dt;const d=Math.hypot(h.position.x,h.position.z);
if(d<1.1){hp--;scene.remove(h);hol.splice(i,1);if(hp<=0){state='over';msg='Defeated! Score '+score+'\nPull trigger to retry'}continue}
const s=(u.big?.6:(.9+wave*.12)*(u.fast?1.8:1))*dt/d;h.position.x-=h.position.x*s;h.position.z-=h.position.z*s;h.position.y=Math.abs(Math.sin(t*3+u.ph))*.15}
ctrls.forEach(c=>{c.updateMatrixWorld(true);tp.set(0,0,-1);c.localToWorld(tp);mp.set(0,0,-.55);c.localToWorld(mp);const pv=c.userData.prev;const sp=pv?tp.distanceTo(pv)/dt:0;c.userData.prev=tp.clone();
if(sp>2.2)hol.slice().forEach(h=>{if(h.userData.cd>0)return;const ce=cen(h),R=.7*h.scale.x;if(tp.distanceTo(ce)<R||mp.distanceTo(ce)<R)hit(h,1)})})}
for(let i=proj.length-1;i>=0;i--){const p=proj[i];p.life-=dt;p.m.position.addScaledVector(p.v,dt);
hol.slice().forEach(h=>{if(!p.hit.has(h)&&p.m.position.distanceTo(cen(h))<1.1*h.scale.x){p.hit.add(h);hit(h,3)}});
if(p.life<=0){scene.remove(p.m);proj.splice(i,1)}}
for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.life-=dt;s.m.position.addScaledVector(s.v,dt);if(s.life<=0){scene.remove(s.m);sparks.splice(i,1)}}
hudT-=dt;if(hudT<=0){drawHud();hudT=.15}
r.render(scene,cam)});
const go=document.getElementById('go'),ui=document.getElementById('ui'),note=document.getElementById('note');
r.xr.addEventListener('sessionstart',()=>{ui.style.display='none';startGame()});r.xr.addEventListener('sessionend',()=>{ui.style.display='flex';state='menu'});
(async()=>{let ok=false;try{ok=navigator.xr&&await navigator.xr.isSessionSupported('immersive-vr')}catch(e){}
if(ok)go.onclick=async()=>{const s=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','hand-tracking']});r.xr.setSession(s)};
else{go.textContent='Preview in browser';note.textContent='Open this on a Quest 2 browser for full VR. Preview: move mouse to turn, click for Moon Arc.';
go.onclick=()=>{ui.style.display='none';startGame();addEventListener('mousemove',e=>{rig.rotation.y=-(e.clientX/innerWidth-.5)*5});addEventListener('click',()=>fire(cam))}}})();
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)});
</script></body></html>
